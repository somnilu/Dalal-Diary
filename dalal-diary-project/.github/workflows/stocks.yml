name: Update stock list
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dalal-diary-project/scripts/build-stocks.mjs
      - name: Commit if changed
        run: |
          git config user.name "dalal-diary-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dalal-diary-project/public/stocks.json
          git diff --cached --quiet || (git commit -m "Update stock list" && git push)
